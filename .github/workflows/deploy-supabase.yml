name: Deploy Supabase functions

# Deploys the edge functions to the live Supabase project whenever their code
# changes on main (or when triggered manually). Requires ONE repo secret:
#   SUPABASE_ACCESS_TOKEN  — a personal access token from
#   https://supabase.com/dashboard/account/tokens
# Add it in: GitHub repo → Settings → Secrets and variables → Actions → New secret.
#
# Until that secret exists, the job runs green but SKIPS deploying (see the guard
# in the deploy step), so it never spams you with failures.

on:
  push:
    branches: [main]
    paths:
      - 'jodiverse/supabase/functions/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch: {}   # lets you run it by hand from the Actions tab

env:
  SUPABASE_PROJECT_REF: yqkvgbbordwurtgnyyxi

jobs:
  deploy-functions:
    name: Deploy edge functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jodiverse
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      # We deploy each function explicitly so per-function auth settings are
      # preserved — notably revenuecat-webhook must stay JWT-less (it's called by
      # RevenueCat, not a signed-in user). Add new functions to this list.
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set — skipping deploy. Add it in Settings → Secrets → Actions."
            exit 0
          fi
          REF="$SUPABASE_PROJECT_REF"
          supabase functions deploy embed-profile     --project-ref "$REF"
          supabase functions deploy generate-profile  --project-ref "$REF"
          supabase functions deploy verify-selfie      --project-ref "$REF"
          supabase functions deploy likes-you          --project-ref "$REF"
          supabase functions deploy notify-message     --project-ref "$REF"
          supabase functions deploy delete-account     --project-ref "$REF"
          supabase functions deploy revenuecat-webhook --no-verify-jwt --project-ref "$REF"
